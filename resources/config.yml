## Main configuration file for MultiWorld

# Do not change this!
config-version: '2.0.0.0'

# Field with prefix
prefix: '§7[MultiWorld]'

# The player's Minecraft language is used when a matching translation is available.
# This language is used as a fallback when no matching translation is available.
language: 'eng'

# Set this to true to use the configured language for every player.
force-default-language: false
