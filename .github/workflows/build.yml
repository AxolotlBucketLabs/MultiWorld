name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build MultiWorld
    runs-on: ubuntu-24.04
    steps:
      - name: Check out MultiWorld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: 208bd1202ccbda139b67b2ca9088d8eb08549b66 # Axolotl-PM 5.51.2
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false
      - name: Set up PHP 8.4 for Axolotl-PM 5
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e # 1.0.0
        with:
          php-version: '8.4'
          install-path: ./.php-bin
          pm-version-major: '5'
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
      - name: Run focused runtime smoke checks
        run: php tests/smoke.php
      - name: Prepare locked virions
        run: php tools/prepare-devtools-virions.php
      - name: Build and analyze with DevTools 4.1.1
        id: build
        uses: AxolotlBucketLabs/DevTools@c2eb715205a9dcb485a4ecabd17512f32f24d5d7 # v4.1.1
        with:
          project: .
          virions: .devtools-virions
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm
      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MultiWorld-${{ steps.build.outputs.plugin-version }}-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            ${{ steps.build.outputs.metadata }}
          if-no-files-found: error
